name: Final Telegram MCP verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Runtime and installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run runtime:apply
      - run: npm run runtime:check
      - run: npm run test:smoke
      - name: Bash syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh uninstall.sh tools/daemon-setup.sh
      - name: PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in @('install.ps1','uninstall.ps1','tools/daemon-setup.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell 5.1 parse failed: $file" }
          }
      - name: PowerShell 7 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1','uninstall.ps1','tools/daemon-setup.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell parse failed: $file" }
          }
  release-source:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/pack-release.mjs --output "$RUNNER_TEMP/telegram-mcp-starter-source.tar.gz"
      - run: node tools/pack-release.mjs --verify "$RUNNER_TEMP/telegram-mcp-starter-source.tar.gz" --expected-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-mcp-starter-source-${{ github.sha }}
          path: ${{ runner.temp }}/telegram-mcp-starter-source.tar.gz
          if-no-files-found: error
          retention-days: 30
